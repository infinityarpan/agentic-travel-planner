services:
  mock-backend:
    build: .
    command: uvicorn mcp_server.server:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"

  orchestrator:
    build: .
    command: uvicorn orchestrator.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MCP_BASE_URL: http://mock-backend:8001
      TRAVEL_DB_PATH: /app/data/travel_planner.db
    volumes:
      - travel-data:/app/data
    depends_on:
      - mock-backend

volumes:
  travel-data:
